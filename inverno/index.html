<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❄️ Inverno - Leguminando</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #74b9ff 0%, #4a6fa5 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header {
            text-align: center;
            padding: 40px 0;
            color: white;
        }
        h1 { font-size: 3em; margin-bottom: 10px; }
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .recipe-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.3s;
            text-decoration: none;
            color: inherit;
        }
        .recipe-card:hover { transform: translateY(-5px); }
        .recipe-card h3 { color: #333; margin-bottom: 10px; }
        .recipe-card .num { color: #74b9ff; font-size: 0.9em; }
        .back-link {
            display: inline-block;
            margin: 30px 0;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            background: rgba(255,255,255,0.2);
            border-radius: 30px;
        }
        .lang-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .lang-tab {
            padding: 10px 20px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            border-radius: 30px;
            cursor: pointer;
        }
        .lang-tab.active { background: white; color: #74b9ff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>❄️ Inverno</h1>
            <p>60 ricette a base di legumi</p>
        </header>
        
        <div class="lang-tabs">
            <button class="lang-tab active">🇮🇹</button>
            <button class="lang-tab">🇬🇧</button>
            <button class="lang-tab">🇪🇸</button>
            <button class="lang-tab">🇵🇹</button>
        </div>
        
        <div class="recipe-grid" id="recipeList">
            <!-- Generato automaticamente -->
        </div>
        
        <a href="../index.html" class="back-link">← Torna alla Home</a>
    </div>
    
    <script>
        // Genera lista ricette
        const recipes = [];
        for(let i = 1; i <= 60; i++) {
            recipes.push(`ricetta-${String(i).padStart(3, '0')}.html`);
        }
        
        const list = document.getElementById('recipeList');
        recipes.forEach((r, idx) => {
            const card = document.createElement('a');
            card.href = r;
            card.className = 'recipe-card';
            card.innerHTML = `
                <div class="num">Ricetta #${idx + 1}</div>
                <h3>🫘 ${r.replace('.html', '').replace('-', ' ').toUpperCase()}</h3>
                <p>Clicca per vedere la ricetta completa</p>
            `;
            list.appendChild(card);
        });
    </script>
</body>
</html>
