<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@leguminando — Ricette di Legumi 🫘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f5f0;
            color: #2c1810;
            line-height: 1.6;
            padding-bottom: 40px;
        }

        .header {
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 50%, #F4A460 100%);
            color: white;
            padding: 30px 20px 20px;
            text-align: center;
            position: relative;
        }
        .header h1 { font-size: 2.2em; margin-bottom: 8px; }
        .header p { font-size: 1.1em; opacity: 0.9; }

        /* 6 Language Flags */
        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            padding: 10px;
        }
        .lang-switch a {
            text-decoration: none;
            font-size: 1.6em;
            opacity: 0.5;
            transition: all 0.3s;
            filter: grayscale(0.3);
        }
        .lang-switch a:hover, .lang-switch a.active {
            opacity: 1;
            transform: scale(1.2);
            filter: grayscale(0);
        }

        /* Hero Image */
        .hero {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .hero-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(139, 69, 19, 0.2);
            display: block;
        }
        .hero-caption {
            text-align: center;
            margin-top: 10px;
            color: #8B4513;
            font-size: 0.9em;
            font-style: italic;
        }

        /* Bottom Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(139, 69, 19, 0.95);
            color: white;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85em;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .bottom-bar .ntp-time {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bottom-bar .ntp-time .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .bottom-bar .view-counter {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .bottom-bar .season-badge {
            background: rgba(255,255,255,0.2);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.9em;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🫘 @leguminando</h1>
        <p>Ricette di legumi nella terra nel tempo</p>

        <!-- 6 Languages -->
        <div class="lang-switch">
            <a href="index.html" class="active" title="Italiano">🇮🇹</a>
            <a href="../en/index.html" title="English">🇬🇧</a>
            <a href="../es/index.html" title="Español">🇪🇸</a>
            <a href="../pt/index.html" title="Português">🇵🇹</a>
            <a href="../fr/index.html" title="Français">🇫🇷</a>
            <a href="../de/index.html" title="Deutsch">🇩🇪</a>
        </div>
    </div>

    <!-- Hero Image: random from season folders -->
    <div class="hero">
        <img id="seasonal-hero" class="hero-img" src="" alt="Ricetta stagionale @leguminando">
        <p class="hero-caption" id="hero-caption">Caricamento immagine stagionale...</p>
    </div>

    <!-- Bottom Bar: NTP Time + View Counter -->
    <div class="bottom-bar">
        <div class="ntp-time">
            <span class="sync-dot"></span>
            <span id="ntp-server">NTP: --</span>
            <span id="current-time">--:--:--</span>
            <span class="season-badge" id="season-badge">--</span>
        </div>
        <div class="view-counter">
            <span>👁️</span>
            <span id="view-count">0</span>
            <span>visualizzazioni</span>
        </div>
    </div>

    <script>
        // ===== CONFIG =====
        const SEASON_FOLDERS = ['primavera', 'estate', 'autunno', 'inverno'];
        const IMAGES_PER_SEASON = 100; // assume 100 images per folder (001.jpg ... 100.jpg)

        // ===== NTP TIME =====
        let ntpOffset = 0;
        let currentSeason = '';

        function getSeason(month) {
            if (month >= 3 && month <= 5)  return { name: '🌸 Primavera', folder: 'primavera' };
            if (month >= 6 && month <= 8)  return { name: '🌞 Estate',    folder: 'estate' };
            if (month >= 9 && month <= 11) return { name: '🍂 Autunno',   folder: 'autunno' };
            return { name: '❄️ Inverno', folder: 'inverno' };
        }

        async function syncNTPTime() {
            try {
                const response = await fetch('https://worldtimeapi.org/api/timezone/Europe/Rome');
                const data = await response.json();
                const serverTime = new Date(data.datetime);
                const localTime = new Date();
                ntpOffset = serverTime - localTime;

                const season = getSeason(serverTime.getMonth() + 1);
                currentSeason = season.folder;

                document.getElementById('ntp-server').textContent = 'NTP: INRIM';
                document.getElementById('season-badge').textContent = season.name;
                return serverTime;
            } catch (e) {
                const now = new Date();
                const season = getSeason(now.getMonth() + 1);
                currentSeason = season.folder;
                document.getElementById('ntp-server').textContent = 'NTP: locale';
                document.getElementById('season-badge').textContent = season.name;
                return now;
            }
        }

        function updateClock() {
            const now = new Date(Date.now() + ntpOffset);
            const timeStr = now.toLocaleTimeString('it-IT', { hour12: false });
            document.getElementById('current-time').textContent = timeStr;
        }

        // ===== VIEW COUNTER =====
        function initViewCounter() {
            const storageKey = 'leguminando_views_v1';
            let views = parseInt(localStorage.getItem(storageKey) || '0');
            views++;
            localStorage.setItem(storageKey, views);
            document.getElementById('view-count').textContent = views.toLocaleString('it-IT');
        }

        // ===== RANDOM SEASONAL IMAGE =====
        function getRandomImage() {
            // Pick random season
            const season = SEASON_FOLDERS[Math.floor(Math.random() * SEASON_FOLDERS.length)];
            // Pick random image 001-100
            const num = String(Math.floor(Math.random() * IMAGES_PER_SEASON) + 1).padStart(3, '0');
            return `../${season}/${num}.jpg`;
        }

        function loadSeasonalHero() {
            const imgPath = getRandomImage();
            const img = document.getElementById('seasonal-hero');
            const caption = document.getElementById('hero-caption');

            img.src = imgPath;
            img.onerror = () => {
                // Fallback: try another random image
                img.src = getRandomImage();
            };

            const seasonName = imgPath.split('/')[1];
            caption.textContent = `📸 Immagine dalla raccolta "${seasonName}" — ricarica la pagina per un'altra`;
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', async () => {
            await syncNTPTime();
            updateClock();
            setInterval(updateClock, 1000);
            initViewCounter();
            loadSeasonalHero();
            setInterval(syncNTPTime, 5 * 60 * 1000);
        });
    </script>
</body>
</html>
